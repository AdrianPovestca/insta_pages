<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Fire Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            overflow: hidden;
        }

        .canvas-fire {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
            perspective: 1000px;
            z-index: 10;
            position: relative;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 1px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: all 0.3s ease;
        }

        .login-container.burning {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 40px rgba(255, 100, 0, 0.6), 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .falling-element {
            position: absolute;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            opacity: 1;
            pointer-events: none;
        }

        .falling-element.text-element {
            background: transparent;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        @keyframes smoke {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 35px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .connect-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .connect-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
        }

        .connect-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .connect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .success-message {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .success-overlay.show .success-message {
            transform: scale(1);
        }

        .success-message h2 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .success-message p {
            color: #666;
            font-size: 15px;
            font-weight: 500;
        }

        .checkmark {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
            animation: checkAnimation 0.6s ease;
        }

        @keyframes checkAnimation {
            0% {
                transform: scale(0) rotate(-45deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
            }

            .title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <canvas id="fireCanvas" class="canvas-fire"></canvas>

    <div class="login-wrapper">
        <div class="login-container" id="loginContainer">
            <form id="loginForm">
                <div id="titleContainer">
                    <h1 class="title">Welcome</h1>
                </div>

                <div id="subtitleContainer">
                    <p class="subtitle">Enter your details to connect</p>
                </div>

                <div id="emailContainer">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div id="passwordContainer">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div id="buttonContainer">
                    <button type="submit" class="connect-btn" id="connectBtn">Connect Now</button>
                </div>
            </form>
        </div>
    </div>

    <div class="success-overlay" id="successOverlay">
        <div class="success-message">
            <span class="checkmark">✓</span>
            <h2>Connected!</h2>
            <p>Rising from the ashes</p>
        </div>
    </div>

    <script>
        class Particle {
            constructor(x, y, vx, vy, scale = 1) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.scale = scale;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.3;
                this.gravity = 0.15;
                this.friction = 0.98;
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.008;
                this.element = null;
            }

            update() {
                this.vy += this.gravity;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.life -= this.decay;

                if (this.element) {
                    this.element.style.left = this.x + 'px';
                    this.element.style.top = this.y + 'px';
                    this.element.style.opacity = Math.max(0, this.life);
                    this.element.style.transform = `rotate(${this.rotation}rad) scale(${this.scale * this.life})`;
                }
            }

            isAlive() {
                return this.life > 0;
            }
        }

        class FireEffect {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.width = canvas.width;
                this.height = canvas.height;
                this.particles = [];
                this.animationId = null;
                this.isActive = false;
            }

            resize() {
                this.width = this.canvas.width = window.innerWidth;
                this.height = this.canvas.height = window.innerHeight;
            }

            createFlames(x, y, intensity = 20) {
                for (let i = 0; i < intensity; i++) {
                    const angle = (Math.random() - 0.5) * Math.PI * 0.8;
                    const speed = Math.random() * 3 + 2;
                    const vx = Math.cos(angle) * speed;
                    const vy = -Math.random() * 5 - 3;
                    
                    const particle = {
                        x: x,
                        y: y,
                        vx: vx,
                        vy: vy,
                        life: 1,
                        size: Math.random() * 30 + 20,
                        hue: Math.random() * 30 + 330
                    };
                    this.particles.push(particle);
                }
            }

            update() {
                this.particles = this.particles.filter(p => {
                    p.vy += 0.1;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.015;
                    p.vx *= 0.99;
                    return p.life > 0;
                });
            }

            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);

                this.particles.forEach(p => {
                    const hue = p.hue + (1 - p.life) * 60;
                    const alpha = Math.pow(p.life, 2) * 0.7;
                    
                    const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    gradient.addColorStop(0, `hsla(${hue}, 100%, 60%, ${alpha})`);
                    gradient.addColorStop(0.5, `hsla(${hue - 20}, 100%, 50%, ${alpha * 0.5})`);
                    gradient.addColorStop(1, `hsla(${hue - 40}, 100%, 40%, 0)`);

                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
            }

            animate() {
                if (!this.isActive) return;
                this.update();
                this.draw();
                this.animationId = requestAnimationFrame(() => this.animate());
            }

            start() {
                this.isActive = true;
                this.canvas.style.display = 'block';
                this.animate();
            }

            stop() {
                this.isActive = false;
                this.canvas.style.display = 'none';
                cancelAnimationFrame(this.animationId);
            }
        }

        // Setup
        const canvas = document.getElementById('fireCanvas');
        const fireEffect = new FireEffect(canvas);
        fireEffect.resize();

        window.addEventListener('resize', () => fireEffect.resize());

        // Elements to fall
        const elementsToFall = [
            { id: 'titleContainer', delay: 0 },
            { id: 'subtitleContainer', delay: 100 },
            { id: 'emailContainer', delay: 200 },
            { id: 'passwordContainer', delay: 300 },
            { id: 'buttonContainer', delay: 400 }
        ];

        const loginForm = document.getElementById('loginForm');
        const connectBtn = document.getElementById('connectBtn');
        const successOverlay = document.getElementById('successOverlay');
        const loginContainer = document.getElementById('loginContainer');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            connectBtn.disabled = true;
            loginContainer.classList.add('burning');
            fireEffect.start();

            // Generate flames continuously during sequence
            let flameInterval = setInterval(() => {
                const containerRect = loginContainer.getBoundingClientRect();
                const centerX = window.innerWidth / 2;
                fireEffect.createFlames(centerX, containerRect.top + containerRect.height / 2, 15);
            }, 50);

            // Create falling elements with physics
            elementsToFall.forEach(({ id, delay }) => {
                setTimeout(() => {
                    const element = document.getElementById(id);
                    if (element) {
                        element.style.position = 'absolute';
                        element.style.pointerEvents = 'none';
                        
                        // Get position relative to viewport
                        const rect = element.getBoundingClientRect();
                        const startX = rect.left;
                        const startY = rect.top;
                        
                        // Create physics object
                        const physics = {
                            x: startX,
                            y: startY,
                            vx: (Math.random() - 0.5) * 4,
                            vy: 0,
                            gravity: 0.25,
                            friction: 0.99,
                            rotation: 0,
                            rotationSpeed: (Math.random() - 0.5) * 0.15
                        };

                        let animationId = requestAnimationFrame(function fallAnim() {
                            physics.vy += physics.gravity;
                            physics.vx *= physics.friction;
                            physics.vy *= physics.friction;
                            physics.x += physics.vx;
                            physics.y += physics.vy;
                            physics.rotation += physics.rotationSpeed;

                            element.style.left = physics.x + 'px';
                            element.style.top = physics.y + 'px';
                            element.style.transform = `rotate(${physics.rotation}rad)`;
                            element.style.opacity = Math.max(0, 1 - (physics.y - startY) / 800);

                            if (physics.y < window.innerHeight + 200) {
                                animationId = requestAnimationFrame(fallAnim);
                            } else {
                                element.style.display = 'none';
                            }
                        });
                    }
                }, delay);
            });

            // Stop fire and show success
            setTimeout(() => {
                clearInterval(flameInterval);
                fireEffect.stop();
                loginContainer.classList.remove('burning');
                successOverlay.classList.add('show');
            }, 2000);

            // Reset
            setTimeout(() => {
                successOverlay.classList.remove('show');
                elementsToFall.forEach(({ id }) => {
                    const element = document.getElementById(id);
                    if (element) {
                        element.style.position = 'relative';
                        element.style.left = '0';
                        element.style.top = '0';
                        element.style.transform = 'none';
                        element.style.opacity = '1';
                        element.style.display = 'block';
                    }
                });
                connectBtn.disabled = false;
                loginForm.reset();
            }, 3500);
        });
    </script>
</body>
</html>
