<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - 3D Destruction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            overflow: hidden;
            perspective: 1200px;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none;
        }

        .scene {
            perspective: 1200px;
            width: 100%;
            max-width: 450px;
            z-index: 10;
            position: relative;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 1px rgba(0, 0, 0, 0.1);
            position: relative;
            transform-style: preserve-3d;
        }

        .form-element {
            margin-bottom: 24px;
            transform-style: preserve-3d;
            transition: all 0.3s ease;
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 35px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .connect-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .connect-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
        }

        .connect-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .connect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .falling-piece {
            position: fixed;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transform-style: preserve-3d;
            z-index: 50;
            pointer-events: none;
        }

        .shadow {
            position: absolute;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="fireCanvas"></canvas>

    <div class="scene">
        <div class="login-container" id="loginContainer">
            <form id="loginForm">
                <div class="form-element" id="title">
                    <h1 class="title">Welcome</h1>
                </div>

                <div class="form-element" id="subtitle">
                    <p class="subtitle">Enter your details to connect</p>
                </div>

                <div class="form-element" id="email">
                    <div class="form-group">
                        <label for="emailInput">Email Address</label>
                        <input type="email" id="emailInput" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-element" id="password">
                    <div class="form-group">
                        <label for="passwordInput">Password</label>
                        <input type="password" id="passwordInput" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="form-element" id="button">
                    <button type="submit" class="connect-btn" id="connectBtn">Connect Now</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('fireCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Fire particle system
        class FireParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -Math.random() * 8 - 4;
                this.life = 1;
                this.size = Math.random() * 40 + 20;
                this.hue = Math.random() * 60;
                this.friction = 0.98;
            }

            update() {
                this.vx *= this.friction;
                this.vy -= 0.2;
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }

            draw() {
                let hue = this.hue + (1 - this.life) * 100;
                const alpha = Math.pow(this.life, 2) * 0.8;

                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                gradient.addColorStop(0, `hsla(${hue}, 100%, 70%, ${alpha})`);
                gradient.addColorStop(0.5, `hsla(${hue + 30}, 100%, 50%, ${alpha * 0.7})`);
                gradient.addColorStop(1, `hsla(${hue + 60}, 100%, 30%, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 3D Falling element with physics
        class FallingElement3D {
            constructor(element, startX, startY, width, height) {
                this.element = element;
                this.x = startX;
                this.y = startY;
                this.z = 0;
                this.width = width;
                this.height = height;
                
                // Velocity
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = -1;
                this.vz = (Math.random() - 0.5) * 2;
                
                // Rotation
                this.rotX = (Math.random() - 0.5) * 0.3;
                this.rotY = (Math.random() - 0.5) * 0.3;
                this.rotZ = (Math.random() - 0.5) * 0.3;
                
                this.angularVx = (Math.random() - 0.5) * 0.15;
                this.angularVy = (Math.random() - 0.5) * 0.15;
                this.angularVz = (Math.random() - 0.5) * 0.15;
                
                this.gravity = 0.35;
                this.friction = 0.99;
                this.bounce = 0.4;
                this.shadow = null;
                
                this.createShadow();
            }

            createShadow() {
                this.shadow = document.createElement('div');
                this.shadow.className = 'shadow';
                this.shadow.style.width = this.width * 0.8 + 'px';
                this.shadow.style.height = this.height * 0.3 + 'px';
                document.body.appendChild(this.shadow);
            }

            update() {
                // Physics
                this.vy += this.gravity;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vz *= this.friction;
                
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;
                
                // Rotation
                this.rotX += this.angularVx;
                this.rotY += this.angularVy;
                this.rotZ += this.angularVz;
                
                // Floor collision
                if (this.y + this.height > window.innerHeight) {
                    this.y = window.innerHeight - this.height;
                    this.vy *= -this.bounce;
                    this.angularVx *= 0.8;
                    this.angularVy *= 0.8;
                    this.angularVz *= 0.8;
                    
                    if (Math.abs(this.vy) < 1) {
                        this.vy = 0;
                    }
                }
                
                // Wall collision
                if (this.x < 0) {
                    this.x = 0;
                    this.vx *= -this.bounce;
                }
                if (this.x + this.width > window.innerWidth) {
                    this.x = window.innerWidth - this.width;
                    this.vx *= -this.bounce;
                }
                
                // Update element
                this.element.style.position = 'fixed';
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                this.element.style.width = this.width + 'px';
                this.element.style.zIndex = '50';
                this.element.style.pointerEvents = 'none';
                
                // 3D Transform
                const perspective = 1200;
                const rotXDeg = this.rotX * (180 / Math.PI);
                const rotYDeg = this.rotY * (180 / Math.PI);
                const rotZDeg = this.rotZ * (180 / Math.PI);
                
                this.element.style.transform = `
                    perspective(${perspective}px)
                    rotateX(${rotXDeg}deg)
                    rotateY(${rotYDeg}deg)
                    rotateZ(${rotZDeg}deg)
                    translateZ(${this.z}px)
                `;
                
                // Update shadow
                if (this.shadow) {
                    const shadowOpacity = Math.max(0, 0.3 - (this.y - window.innerHeight / 2) / 1000);
                    const shadowScale = 1 - Math.min(0.7, this.y / window.innerHeight);
                    this.shadow.style.left = (this.x + this.width * 0.1) + 'px';
                    this.shadow.style.top = (this.y + this.height) + 'px';
                    this.shadow.style.opacity = shadowOpacity;
                    this.shadow.style.transform = `scaleX(${shadowScale})`;
                }
            }

            isActive() {
                return this.y < window.innerHeight + 200;
            }

            destroy() {
                if (this.shadow) {
                    this.shadow.remove();
                }
            }
        }

        let fireParticles = [];
        let fallingElements = [];
        let fireActive = false;

        function drawFire() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            fireParticles = fireParticles.filter(p => p.life > 0);
            fireParticles.forEach(p => {
                p.update();
                p.draw();
            });
        }

        function animate() {
            drawFire();

            if (fireActive) {
                requestAnimationFrame(animate);
            }
        }

        function generateFire(x, y) {
            for (let i = 0; i < 8; i++) {
                fireParticles.push(new FireParticle(x, y));
            }
        }

        const loginForm = document.getElementById('loginForm');
        const connectBtn = document.getElementById('connectBtn');
        const loginContainer = document.getElementById('loginContainer');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            connectBtn.disabled = true;
            fireActive = true;
            canvas.style.display = 'block';

            const containerRect = loginContainer.getBoundingClientRect();
            const fireX = containerRect.left + containerRect.width / 2;
            const fireY = containerRect.top + containerRect.height / 2;

            // Generate fire
            const fireInterval = setInterval(() => {
                if (fireActive) {
                    generateFire(fireX, fireY);
                } else {
                    clearInterval(fireInterval);
                }
            }, 40);

            // Elements to drop
            const elementIds = ['title', 'subtitle', 'email', 'password', 'button'];
            let elementIndex = 0;

            const dropNextElement = () => {
                if (elementIndex < elementIds.length && fireActive) {
                    const elementId = elementIds[elementIndex];
                    const element = document.getElementById(elementId);
                    
                    if (element) {
                        const rect = element.getBoundingClientRect();
                        const falling = new FallingElement3D(
                            element,
                            rect.left,
                            rect.top,
                            rect.width,
                            rect.height
                        );
                        fallingElements.push(falling);
                    }
                    
                    elementIndex++;
                    setTimeout(dropNextElement, 120);
                }
            };

            setTimeout(dropNextElement, 250);

            // Fire duration
            setTimeout(() => {
                fireActive = false;
                setTimeout(() => {
                    canvas.style.display = 'none';
                    connectBtn.disabled = false;

                    elementIds.forEach(id => {
                        const element = document.getElementById(id);
                        if (element) {
                            element.style.position = 'relative';
                            element.style.left = '0';
                            element.style.top = '0';
                            element.style.transform = 'none';
                            element.style.zIndex = 'auto';
                            element.style.width = 'auto';
                        }
                    });

                    fallingElements.forEach(el => el.destroy());
                    fallingElements = [];
                    loginForm.reset();
                }, 2500);
            }, 2500);

            // Physics update loop
            const physicsInterval = setInterval(() => {
                fallingElements = fallingElements.filter(el => el.isActive());
                fallingElements.forEach(el => el.update());

                if (!fireActive && fallingElements.length === 0) {
                    clearInterval(physicsInterval);
                }
            }, 16);

            animate();
        });
    </script>
</body>
</html>
