<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Shattering</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            overflow: hidden;
            perspective: 1200px;
        }

        .scene {
            perspective: 1200px;
            width: 100%;
            max-width: 450px;
            z-index: 10;
            position: relative;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 1px rgba(0, 0, 0, 0.1);
            position: relative;
            transform-style: preserve-3d;
        }

        .form-element {
            margin-bottom: 24px;
            transform-style: preserve-3d;
            transition: all 0.3s ease;
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 35px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .connect-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .connect-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
        }

        .connect-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .connect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .shattering-piece {
            position: fixed;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transform-style: preserve-3d;
            z-index: 50;
            pointer-events: none;
        }

        .debris-particle {
            position: fixed;
            pointer-events: none;
            z-index: 49;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="login-container" id="loginContainer">
            <form id="loginForm">
                <div class="form-element" id="title">
                    <h1 class="title">Welcome</h1>
                </div>

                <div class="form-element" id="subtitle">
                    <p class="subtitle">Enter your details to connect</p>
                </div>

                <div class="form-element" id="email">
                    <div class="form-group">
                        <label for="emailInput">Email Address</label>
                        <input type="email" id="emailInput" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-element" id="password">
                    <div class="form-group">
                        <label for="passwordInput">Password</label>
                        <input type="password" id="passwordInput" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="form-element" id="button">
                    <button type="submit" class="connect-btn" id="connectBtn">Connect Now</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Debris particle system - heavier smoke effect
        class DebrisParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8 - 1;
                this.life = 1;
                // Bigger particles for heavier smoke effect
                this.size = Math.random() * 20 + 8;
                this.opacity = Math.random() * 0.6 + 0.3;
                // Much slower decay - particles last 4+ seconds
                this.decay = Math.random() * 0.008 + 0.004;
                this.gravity = 0.08;
                this.element = null;
            }

            create() {
                this.element = document.createElement('div');
                this.element.className = 'debris-particle';
                this.element.style.width = this.size + 'px';
                this.element.style.height = this.size + 'px';
                // Smoke-like gray color, more transparent
                this.element.style.background = `rgba(180, 180, 180, ${this.opacity * 0.7})`;
                this.element.style.borderRadius = '50%';
                this.element.style.boxShadow = `0 0 ${this.size * 1.5}px rgba(120, 120, 120, 0.4)`;
                this.element.style.filter = 'blur(2px)';
                document.body.appendChild(this.element);
            }

            update() {
                this.vy += this.gravity;
                this.vx *= 0.99;
                this.vy *= 0.99;
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;

                if (this.element) {
                    this.element.style.left = this.x + 'px';
                    this.element.style.top = this.y + 'px';
                    this.element.style.opacity = Math.max(0, this.life * this.opacity * 0.7);
                }
            }

            isAlive() {
                return this.life > 0;
            }

            remove() {
                if (this.element) {
                    this.element.remove();
                }
            }
        }

        // Shattering piece
        class ShatteringPiece {
            constructor(element, startX, startY, width, height) {
                this.element = element;
                this.x = startX;
                this.y = startY;
                this.z = 0;
                this.width = width;
                this.height = height;
                
                // Random velocity in all directions
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10 - 3;
                this.vz = (Math.random() - 0.5) * 8 - 4;
                
                // Rotation
                this.rotX = (Math.random() - 0.5) * 0.5;
                this.rotY = (Math.random() - 0.5) * 0.5;
                this.rotZ = (Math.random() - 0.5) * 0.5;
                
                this.angularVx = (Math.random() - 0.5) * 0.25;
                this.angularVy = (Math.random() - 0.5) * 0.25;
                this.angularVz = (Math.random() - 0.5) * 0.25;
                
                this.gravity = 0.2;
                this.friction = 0.96;
                this.life = 1;
                // Much slower decay - elements stay longer before disappearing
                this.decay = 0.005;
                this.debrisParticles = [];
            }

            update() {
                // Physics
                this.vy += this.gravity;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vz *= this.friction;
                
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;
                
                // Rotation
                this.rotX += this.angularVx;
                this.rotY += this.angularVy;
                this.rotZ += this.angularVz;
                
                // Generate debris trail
                if (Math.random() > 0.7) {
                    const debris = new DebrisParticle(
                        this.x + this.width / 2,
                        this.y + this.height / 2
                    );
                    debris.create();
                    this.debrisParticles.push(debris);
                }
                
                // Update debris
                this.debrisParticles = this.debrisParticles.filter(d => d.isAlive());
                this.debrisParticles.forEach(d => d.update());
                
                // Fade out
                this.life -= this.decay;
                
                // Update element
                this.element.style.position = 'fixed';
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                this.element.style.width = this.width + 'px';
                this.element.style.zIndex = '50';
                this.element.style.pointerEvents = 'none';
                this.element.style.opacity = Math.max(0, this.life);
                
                // 3D Transform
                const rotXDeg = this.rotX * (180 / Math.PI);
                const rotYDeg = this.rotY * (180 / Math.PI);
                const rotZDeg = this.rotZ * (180 / Math.PI);
                const scale = 0.7 + this.life * 0.3;
                
                this.element.style.transform = `
                    perspective(1200px)
                    rotateX(${rotXDeg}deg)
                    rotateY(${rotYDeg}deg)
                    rotateZ(${rotZDeg}deg)
                    translateZ(${this.z}px)
                    scale(${scale})
                `;
            }

            isAlive() {
                return this.life > 0;
            }

            cleanup() {
                this.debrisParticles.forEach(d => d.remove());
            }
        }

        const loginForm = document.getElementById('loginForm');
        const connectBtn = document.getElementById('connectBtn');
        const loginContainer = document.getElementById('loginContainer');
        let shatteringPieces = [];
        let debrisParticles = [];

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            connectBtn.disabled = true;

            // Get container position
            const containerRect = loginContainer.getBoundingClientRect();
            const centerX = containerRect.left + containerRect.width / 2;
            const centerY = containerRect.top + containerRect.height / 2;

            // Create debris burst at center - more debris for heavier effect
            for (let i = 0; i < 50; i++) {
                const debris = new DebrisParticle(centerX, centerY);
                debris.create();
                debrisParticles.push(debris);
            }

            // Shatter all form elements
            const elementIds = ['title', 'subtitle', 'email', 'password', 'button'];
            
            elementIds.forEach((id, index) => {
                setTimeout(() => {
                    const element = document.getElementById(id);
                    if (element) {
                        const rect = element.getBoundingClientRect();
                        
                        // Create more debris at element position - increased from 8 to 15
                        for (let i = 0; i < 15; i++) {
                            const debris = new DebrisParticle(rect.left + rect.width / 2, rect.top + rect.height / 2);
                            debris.create();
                            debrisParticles.push(debris);
                        }
                        
                        const shattering = new ShatteringPiece(
                            element,
                            rect.left,
                            rect.top,
                            rect.width,
                            rect.height
                        );
                        shatteringPieces.push(shattering);
                    }
                }, index * 50);
            });

            // Animation loop
            const animationInterval = setInterval(() => {
                // Update shattering pieces
                shatteringPieces = shatteringPieces.filter(piece => piece.isAlive());
                shatteringPieces.forEach(piece => piece.update());
                
                // Update loose debris
                debrisParticles = debrisParticles.filter(d => d.isAlive());
                debrisParticles.forEach(d => d.update());

                if (shatteringPieces.length === 0 && debrisParticles.length === 0) {
                    clearInterval(animationInterval);
                    
                    // Cleanup
                    shatteringPieces.forEach(piece => piece.cleanup());
                    debrisParticles.forEach(d => d.remove());
                    
                    // Reset after 4 seconds total
                    setTimeout(() => {
                        elementIds.forEach(id => {
                            const element = document.getElementById(id);
                            if (element) {
                                element.style.position = 'relative';
                                element.style.left = '0';
                                element.style.top = '0';
                                element.style.transform = 'none';
                                element.style.zIndex = 'auto';
                                element.style.width = 'auto';
                                element.style.opacity = '1';
                            }
                        });
                        
                        connectBtn.disabled = false;
                        loginForm.reset();
                    }, 4000);
                }
            }, 16);
        });
    </script>
</body>
</html>
