<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Realistic Fire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
            z-index: 10;
            position: relative;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .form-element {
            margin-bottom: 24px;
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 35px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .connect-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .connect-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
        }

        .connect-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .connect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <canvas id="fireCanvas"></canvas>

    <div class="login-wrapper">
        <div class="login-container" id="loginContainer">
            <form id="loginForm">
                <div class="form-element" id="title">
                    <h1 class="title">Welcome</h1>
                </div>

                <div class="form-element" id="subtitle">
                    <p class="subtitle">Enter your details to connect</p>
                </div>

                <div class="form-element" id="email">
                    <div class="form-group">
                        <label for="emailInput">Email Address</label>
                        <input type="email" id="emailInput" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-element" id="password">
                    <div class="form-group">
                        <label for="passwordInput">Password</label>
                        <input type="password" id="passwordInput" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="form-element" id="button">
                    <button type="submit" class="connect-btn" id="connectBtn">Connect Now</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('fireCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Particle system for realistic fire
        class FireParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -Math.random() * 8 - 4;
                this.life = 1;
                this.size = Math.random() * 40 + 20;
                this.hue = Math.random() * 60 + 0;
                this.friction = 0.98;
            }

            update() {
                this.vx *= this.friction;
                this.vy -= 0.2;
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }

            draw() {
                const colorLife = this.life * 360;
                let hue = this.hue + (1 - this.life) * 100;
                let saturation = 100;
                let lightness = 50 * this.life;

                if (this.life > 0.5) {
                    lightness = 50 * (1 - (this.life - 0.5) * 2);
                }

                const alpha = Math.pow(this.life, 2) * 0.8;

                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                gradient.addColorStop(0, `hsla(${hue}, ${saturation}%, 70%, ${alpha})`);
                gradient.addColorStop(0.5, `hsla(${hue + 30}, ${saturation}%, ${lightness}%, ${alpha * 0.7})`);
                gradient.addColorStop(1, `hsla(${hue + 60}, ${saturation}%, ${lightness}%, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Element physics
        class FallingElement {
            constructor(element, startX, startY, width, height) {
                this.element = element;
                this.x = startX;
                this.y = startY;
                this.width = width;
                this.height = height;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = 0;
                this.rotation = Math.random() * Math.PI * 2;
                this.angularVelocity = (Math.random() - 0.5) * 0.3;
                this.gravity = 0.35;
                this.friction = 0.98;
                this.bounceFriction = 0.4;
            }

            update() {
                this.vy += this.gravity;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.angularVelocity;

                // Floor bounce
                if (this.y + this.height > window.innerHeight) {
                    this.y = window.innerHeight - this.height;
                    this.vy *= -this.bounceFriction;
                    this.angularVelocity *= 0.8;
                    if (Math.abs(this.vy) < 1) {
                        this.vy = 0;
                    }
                }

                // Wall bounce
                if (this.x < 0) {
                    this.x = 0;
                    this.vx *= -this.bounceFriction;
                }
                if (this.x + this.width > window.innerWidth) {
                    this.x = window.innerWidth - this.width;
                    this.vx *= -this.bounceFriction;
                }

                // Update element position
                this.element.style.position = 'fixed';
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                this.element.style.transform = `rotate(${this.rotation}rad)`;
                this.element.style.zIndex = '50';
                this.element.style.pointerEvents = 'none';
            }

            isActive() {
                return this.y < window.innerHeight + 100;
            }
        }

        let fireParticles = [];
        let fallingElements = [];
        let fireActive = false;
        let elementsFalling = false;

        function drawFire() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw fire particles
            fireParticles = fireParticles.filter(p => p.life > 0);
            fireParticles.forEach(p => {
                p.update();
                p.draw();
            });
        }

        function animate() {
            drawFire();

            if (fireActive || elementsFalling) {
                requestAnimationFrame(animate);
            }
        }

        function generateFire(x, y) {
            for (let i = 0; i < 8; i++) {
                fireParticles.push(new FireParticle(x, y));
            }
        }

        const loginForm = document.getElementById('loginForm');
        const connectBtn = document.getElementById('connectBtn');
        const loginContainer = document.getElementById('loginContainer');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            connectBtn.disabled = true;
            fireActive = true;
            elementsFalling = true;
            canvas.style.display = 'block';

            // Get container center for fire
            const containerRect = loginContainer.getBoundingClientRect();
            const fireX = window.innerWidth / 2;
            const fireY = containerRect.top + containerRect.height / 2;

            // Generate continuous fire
            const fireInterval = setInterval(() => {
                if (fireActive) {
                    generateFire(fireX, fireY);
                } else {
                    clearInterval(fireInterval);
                }
            }, 40);

            // Elements to make fall
            const elementIds = ['title', 'subtitle', 'email', 'password', 'button'];
            let currentElementIndex = 0;

            const dropNextElement = () => {
                if (currentElementIndex < elementIds.length && fireActive) {
                    const elementId = elementIds[currentElementIndex];
                    const element = document.getElementById(elementId);
                    if (element) {
                        const rect = element.getBoundingClientRect();
                        const fallingElement = new FallingElement(
                            element,
                            rect.left,
                            rect.top,
                            rect.width,
                            rect.height
                        );
                        fallingElements.push(fallingElement);
                    }
                    currentElementIndex++;
                    setTimeout(dropNextElement, 150);
                }
            };

            // Start dropping elements after delay
            setTimeout(dropNextElement, 200);

            // Fire duration
            setTimeout(() => {
                fireActive = false;
                setTimeout(() => {
                    canvas.style.display = 'none';
                    elementsFalling = false;
                    connectBtn.disabled = false;

                    // Reset
                    elementIds.forEach(id => {
                        const element = document.getElementById(id);
                        if (element) {
                            element.style.position = 'relative';
                            element.style.left = '0';
                            element.style.top = '0';
                            element.style.transform = 'none';
                            element.style.zIndex = 'auto';
                        }
                    });

                    fallingElements = [];
                    loginForm.reset();
                }, 3000);
            }, 2500);

            // Physics update loop
            const physicsInterval = setInterval(() => {
                fallingElements = fallingElements.filter(el => el.isActive());
                fallingElements.forEach(el => el.update());

                if (!elementsFalling && fallingElements.length === 0) {
                    clearInterval(physicsInterval);
                }
            }, 16);

            animate();
        });
    </script>
</body>
</html>
